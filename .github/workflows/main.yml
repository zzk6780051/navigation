name: 自动更新导航站

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 准备部署文件
        run: |
          # 创建部署目录结构
          mkdir -p deploy
          cp index.html about.html deploy/ 2>/dev/null || true
          # 复制 daohang 目录
          cp -r daohang deploy/ 2>/dev/null || true
          # 复制其他可能的静态资源
          cp -r css js images deploy/ 2>/dev/null || true
          echo "部署文件准备完成"
      
      - name: Deploy to Halo
        run: |
          npx halo-static-pages-deploy-cli deploy -e ${{ secrets.ENDPOINT }} -i ${{ secrets.ID }} -t ${{ secrets.PAT }} -f deploy
