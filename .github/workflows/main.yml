name: 自动更新blog/daohang

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 创建必要的包管理文件
        run: |
          # 创建最小的 package.json 以避免错误
          echo '{
            "name": "navigation",
            "version": "1.0.0",
            "description": "",
            "scripts": {
              "build": "echo \"No build process needed for static site\""
            }
          }' > package.json
          
          # 创建 dist 目录并复制文件
          mkdir -p dist
          cp index.html about.html dist/ 2>/dev/null || true
          
          # 复制 daohang 目录（如果存在）
          cp -r daohang dist/ 2>/dev/null || true
      
      - name: Deploy to Halo
        run: |
          npx halo-static-pages-deploy-cli deploy -e ${{ secrets.ENDPOINT }} -i ${{ secrets.ID }} -t ${{ secrets.PAT }} -f dist
