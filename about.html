<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于网站 - China_zzk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 统计脚本 -->
    <script defer src="https://activity.china-zzk.com/tracker.min.js" data-website-id="导航站"></script>
    <style>
        /* 样式保持不变 */
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-compass"></i>
                    <span>China_zzk</span>
                </div>
                <!-- 修复返回首页路径 -->
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    返回首页
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="about-card">
                <h1 class="about-title">关于网站</h1>
                <div class="about-methods">
                    <div class="about-method" id="contact-owner">
                        <div class="about-icon">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="about-info">
                            <div class="about-name">联系所有者</div>
                            <div class="about-desc">如有问题或建议，请联系网站所有者</div>
                            <div class="contact-items" id="contact-items">
                                <a href="https://t.me/China_zzk_bot" target="_blank" class="contact-item">
                                    <div class="contact-icon">
                                        <i class="fab fa-telegram"></i>
                                    </div>
                                    <div class="contact-text">
                                        <div class="contact-label">Telegram</div>
                                        <div class="contact-value">@China_zzk_bot</div>
                                    </div>
                                </a>
                                <a href="mailto:zzk@china-zzk.com" class="contact-item">
                                    <div class="contact-icon">
                                        <i class="fas fa-envelope"></i>
                                    </div>
                                    <div class="contact-text">
                                        <div class="contact-label">电子邮箱</div>
                                        <div class="contact-value">zzk@china-zzk.com</div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <a href="https://doc.china-zzk.com" target="_blank" class="about-method">
                        <div class="about-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="about-info">
                            <div class="about-name">关于开发者</div>
                            <div class="about-desc">了解更多关于开发者的信息和技术文档</div>
                            <div class="contact-items">
                                <div class="contact-item" style="cursor: default;">
                                    <div class="contact-icon">
                                        <i class="fas fa-external-link-alt"></i>
                                    </div>
                                    <div class="contact-text">
                                        <div class="contact-label">开发者文档</div>
                                        <div class="contact-value">doc.china-zzk.com</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="about-links">
                    <!-- 修复关于页面路径 -->
                    <a href="about.html">关于网站</a>
                </div>
                <p>© 2025 <a href="https://china-zzk.com" style="color: inherit; text-decoration: none;">China_zzk</a></p>
            </div>
        </div>
    </footer>

    <script>
        // 处理联系所有者卡片的点击事件
        document.getElementById('contact-owner').addEventListener('click', function() {
            const contactItems = document.getElementById('contact-items');
            contactItems.classList.toggle('expanded');
        });

        // 防止联系方式链接点击时触发卡片折叠/展开
        document.querySelectorAll('.contact-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
</body>
</html>
